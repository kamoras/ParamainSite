name: 💡 App idea
description: Pitch a brand-new app or tool for the Paramain portfolio.
title: "Idea: "
labels: ["idea"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for dreaming one up! The best tools start as someone's small
        frustration. Tell us what should exist.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What problem does this solve, and who does it help?
      placeholder: People who ... struggle to ... because ...
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: Describe the app or tool. What would it do?
    validations:
      required: true
  - type: input
    id: existing
    attributes:
      label: Existing alternatives
      description: Are there paid/closed tools that do this today? Link them.
  - type: checkboxes
    id: principles
    attributes:
      label: Fits the Paramain ethos
      options:
        - label: It can be free, with no ads or paywalls
        - label: It can (eventually) be open source
        - label: It respects users' privacy and data
