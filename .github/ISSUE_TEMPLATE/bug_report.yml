name: 🐞 Bug report
description: Something on the site is broken or behaving unexpectedly.
title: "Bug: "
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See the error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
  - type: input
    id: environment
    attributes:
      label: Browser / device
      placeholder: e.g. Chrome 124 on macOS, Safari on iPhone 15
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: If applicable, drag images in to help explain.
